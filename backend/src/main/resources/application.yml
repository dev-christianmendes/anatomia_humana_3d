spring:
  application:
    name: anatomia-3d-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/anatomia}
    username: ${DATABASE_USERNAME:anatomia}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  override-with-generic-response: false